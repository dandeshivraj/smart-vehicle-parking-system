<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Parking Dashboard</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar navbar-dark bg-dark">
  <div class="container-fluid">
    <span class="navbar-brand">🚗 Vehicle Parking System</span>
  </div>
</nav>

<div class="container mt-4 text-center">
  <h2 class="mb-4">Dashboard</h2>

  <!-- Stats -->
  <div class="row justify-content-center mb-4">
    <div class="col-md-3">
      <div class="card shadow">
        <div class="card-body">
          <h5>Total Slots</h5>
          <h3 id="total">50</h3>
        </div>
      </div>
    </div>

    <div class="col-md-3">
      <div class="card shadow">
        <div class="card-body">
          <h5>Occupied</h5>
          <h3 id="occupied">0</h3>
        </div>
      </div>
    </div>

    <div class="col-md-3">
      <div class="card shadow">
        <div class="card-body">
          <h5>Available</h5>
          <h3 id="available">50</h3>
        </div>
      </div>
    </div>
  </div>

  <!-- Buttons -->
  <div class="mb-4">
    <a href="entry.html" class="btn btn-primary m-2">➕ Vehicle Entry</a>
    <a href="exit.html" class="btn btn-success m-2">🚘 Vehicle Exit</a>
  </div>

  <!-- History Table -->
  <h4 class="mt-4">📜 Parking History</h4>

  <div class="table-responsive">
    <table class="table table-bordered table-striped mt-3">
      <thead class="table-dark">
        <tr>
          <th>#</th>
          <th>Vehicle Number</th>
          <th>Type</th>
          <th>Entry Time</th>
          <th>Exit Time</th>
          <th>Fee (₹)</th>
        </tr>
      </thead>
      <tbody id="historyTable">
        <!-- Filled by JS -->
      </tbody>
    </table>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
